name=NetworkProfile
version=0.9.0
author=Péter Soós
maintainer=Péter Soós
sentence=Thread-safe network interface configuration profiles for ESP32, ESP8266 and AVR.
paragraph=WiFiProfile and EthProfile hold a network interface's configuration (DHCP/static IP, DNS, hostname, MAC address, priority for ETH -> WiFi fallback). NtpProfile holds the NTP servers a device synchronises from, and MqttProfile the settings needed to reach an MQTT broker. All four offer thread-safe access, validation, persistent storage via Preferences, and JSON serialisation. Depends on the Host library.
category=Communication
url=https://github.com/soosp/NetworkProfile
architectures=esp32,esp8266,avr
includes=NetworkProfile.h,EthProfile.h,WiFiProfile.h,MqttProfile.h,NtpProfile.h,SyslogProfile.h
depends=Host,EEPROMPreferences,Preferences
license=MIT
